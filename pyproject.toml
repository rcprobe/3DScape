[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "3dscape"
version = "0.1.0"
description = "Indoor RGB-D reconstruction experiment: dataset adapters, point-cloud fusion, mesh comparison, browser viewing, and reliability diagnostics."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "3DScape contributors" }]
dependencies = [
  "numpy>=1.23",
  "opencv-python>=4.8",
  "Pillow>=10.0",
]

[project.optional-dependencies]
ml = [
  "torch>=2.1",
]
dev = [
  "pytest>=8.0,<10",
  "ruff>=0.15,<0.16",
]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["scapev3", "scapev3.learned"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
